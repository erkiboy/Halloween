image: node:22-alpine

stages:
  - test
  - deploy

test:
  stage: test
  script:
    - npm ci
    - npm run test:unit
    - npm run build

pages:
  stage: deploy
  script:
    - npm ci
    - npm run build
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
